name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macOS 26 image: its Xcode provides the macOS 26 SDK that the Liquid Glass material needs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version
          xcrun --show-sdk-path

      - name: Build universal app
        run: ARCHS="arm64 x86_64" VERSION="${{ steps.version.outputs.value }}" ./build.sh

      - name: Verify bundle
        run: |
          lipo -info build/ClaudeUsageWidget.app/Contents/MacOS/ClaudeUsageWidget
          codesign --verify --deep --strict build/ClaudeUsageWidget.app
          plutil -p build/ClaudeUsageWidget.app/Contents/Info.plist | grep -E "Version|Identifier"

      - name: Package
        run: |
          ditto -c -k --keepParent build/ClaudeUsageWidget.app \
            "ClaudeUsageWidget-${{ steps.version.outputs.value }}-macos.zip"
          shasum -a 256 ClaudeUsageWidget-*.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget
          path: |
            ClaudeUsageWidget-*.zip
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ClaudeUsageWidget-*.zip SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
